name: Extract SEC concentration data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 20 * * 0"   # weekly, Monday 04:30 Singapore time

permissions:
  contents: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Probe SEC access
        run: |
          for ua in "A_Chain research charliebrown390@users.noreply.github.com" "Charliebrown390 achain.research@gmail.com" "Mozilla/5.0 (compatible; A_Chain/1.0; +https://github.com/Charliebrown390/A_Chain)"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -A "$ua" https://www.sec.gov/files/company_tickers.json)
            code2=$(curl -s -o /dev/null -w "%{http_code}" -A "$ua" https://data.sec.gov/submissions/CIK0001045810.json)
            echo "$code $code2 :: $ua"
          done
      - run: python scripts/sec_concentration.py
      - name: Commit results
        run: |
          git config user.name "a-chain-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/sec_concentration.json
          git diff --cached --quiet || git commit -m "data: refresh SEC concentration facts"
          git push
