name: Extract SEC concentration data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 20 * * 0"   # weekly, Monday 04:30 Singapore time

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/sec_concentration.py
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      - run: python scripts/build_site_data.py
      - name: Commit results
        run: |
          git config user.name "a-chain-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/sec_concentration.json site/data
          git diff --cached --quiet || git commit -m "data: refresh SEC concentration facts"
          git pull --rebase -q && git push
  deploy:
    needs: extract
    uses: ./.github/workflows/pages.yml
