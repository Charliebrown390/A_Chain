name: Refresh market data

on:
  schedule:
    - cron: "15 22 * * 1-5"   # full refresh after each US close, Mon-Fri sessions (06:15 Singapore, Tue-Sat); nothing on weekends
    - cron: "40 14 * * 1-5"   # implied-vol snapshot early in the US session
    - cron: "30 17 * * 1-5"   # second snapshot, in case GitHub delays the first past the close; the script skips if the market is shut
    - cron: "0 */3 * * *"     # headlines every three hours
  workflow_dispatch:
    inputs:
      mode:
        description: "full, options or news"
        default: full
        type: choice
        options: [full, options, news]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pick mode
        id: mode
        run: |
          case "${{ github.event.schedule }}" in
            "15 22 * * 1-5") m=full ;;
            "40 14 * * 1-5"|"30 17 * * 1-5") m=options ;;
            "0 */3 * * *") m=news ;;
            *) m="${{ inputs.mode || 'full' }}" ;;
          esac
          echo "mode=$m" >> "$GITHUB_OUTPUT"
      - run: python scripts/market_data.py --mode ${{ steps.mode.outputs.mode }}
      - name: Capital-market backdrop (FRED)
        if: steps.mode.outputs.mode == 'full'
        run: python scripts/macro_data.py
      - run: python scripts/build_site_data.py
      - run: python -m pytest -q tests
      - name: Commit results
        run: |
          git config user.name "a-chain-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data data/history
          git diff --cached --quiet && exit 0
          git commit -q -m "data: ${{ steps.mode.outputs.mode }} refresh"
          git pull --rebase -q && git push
  deploy:
    needs: refresh
    uses: ./.github/workflows/pages.yml
