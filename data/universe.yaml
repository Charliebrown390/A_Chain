# A_Chain company universe (core). Edit by hand; scripts/build_site_data.py compiles it to site/data/.
# Fields:
#   id      unique key used everywhere (ticker for listed names)
#   label   short name shown on the map
#   layer   1-10, see layers below
#   segment sub-segment within the layer
#   yf      Yahoo Finance symbol (null for private)
#   sec     ticker as known to SEC EDGAR (null if not an SEC filer)
#   role    one line: what it does in the AI chain

#   watchlist: names under review, shown on the page but not on the map
layers:
- n: 1
  name: Tools & design software
  short: Tools & EDA
  neck: EUV lithography has one supplier
- n: 2
  name: Merchant chips (GPU, CPU, IP)
  short: Merchant chips
  neck: Wafer and packaging allocation at TSMC
- n: 3
  name: Custom chip (ASIC) partners
  short: Custom ASICs
  neck: Design wins are lumpy; CoWoS allocation caps volumes
- n: 4
  name: Foundry, packaging & substrates
  short: Foundry & packaging
  neck: CoWoS capacity and high-layer substrates
- n: 5
  name: Memory & storage
  short: Memory & storage
  neck: HBM supply and HBM4 qualification
- n: 6
  name: Networking & optics
  short: Networking & optics
  neck: 1.6T optics and laser capacity
- n: 7
  name: Servers & assembly
  short: Servers & assembly
  neck: Rack-scale integration and liquid cooling
- n: 8
  name: Power & data centres
  short: Power & DCs
  neck: Grid hook-ups, gas turbines, transformers
- n: 9
  name: Compute providers
  short: Compute providers
  neck: Capex budgets; neocloud financing
- n: 10
  name: Models & applications
  short: Models & apps
  neck: Paid AI usage that justifies the capex
