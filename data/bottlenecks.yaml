# Bottleneck monitor: hand-maintained indicators of tightness or slack along the chain.
# The page turns each indicator into a signal (tight / balanced / loose) using its `rule`, and marks it
# "stale" if the newest point is older than `fresh_days`.
#
# To add a data point: append [date, value] to `series` (date as YYYY-MM-DD; use the period end for
# quarterly or half-year data) and add its source to `sources`. Keep the newest point last.
# Rules:
#   level   -> tight if value >= tight_above (or <= tight_below); loose if value <= loose_below (or >= loose_above)
#   change  -> % change between the last two points, compared with tight_above / loose_below
#   curve   -> term structure: tight when the 12-month rate is below spot by more than `margin`% (backwardation)
# Automated indicators (supplier inventory days, days to get paid, backlog) are computed on the page from
# the nightly market and SEC data and need no editing here.

indicators:
  - id: b200_rent
    layer: Accelerators (rental)
    name: B200 rental rate (neocloud index)
    unit: "$/GPU-hr"
    rule: {type: change, tight_above: 5, loose_below: -10}
    fresh_days: 45
    update: "Monthly. Silicon Data posts SDB200RT updates on its blog (silicondata.com/blog). CME lists B200 rental futures (code GPU2) from 5 Oct 2026; settlement prices are on cmegroup.com."
    series:
      - ["2026-01-01", 4.40]
      - ["2026-06-01", 5.42]
      - ["2026-07-01", 5.63]
      - ["2026-08-01", 5.67]
      - ["2026-09-01", 5.62]
    note: "Jan value derived from the reported +27.6% year-to-date change at 1 Sep."
    sources:
      - {src: "Silicon Data, B200 rental price update (Aug 2026)", url: "https://www.silicondata.com/blog/b200-rental-price-august-2026-update"}
  - id: b200_curve
    layer: Accelerators (rental)
    name: B200 rental term structure
    unit: "$/GPU-hr"
    rule: {type: curve, margin: 2}
    fresh_days: 45
    update: "Monthly, from the same Silicon Data post (spot and 3/6/12-month quoted rates), or from GPU2 futures prices once trading is established."
    curve:
      date: "2026-09-07"
      points: [["Spot", 5.69], ["3m", 5.73], ["6m", 5.64], ["12m", 5.39]]
    sources:
      - {src: "Silicon Data, B200 rental price update (Aug 2026)", url: "https://www.silicondata.com/blog/b200-rental-price-august-2026-update"}
  - id: h100_rent
    layer: Accelerators (rental)
    name: H100 rental rate (neocloud)
    unit: "$/GPU-hr"
    rule: {type: change, tight_above: 5, loose_below: -10}
    fresh_days: 60
    update: "Monthly, from the same Silicon Data posts. A falling older-generation rate signals ageing, not necessarily overcapacity; compare with the B200 trend."
    series:
      - ["2026-07-27", 2.75]
      - ["2026-09-07", 2.63]
    sources:
      - {src: "Silicon Data, B200 rental price update (Aug 2026)", url: "https://www.silicondata.com/blog/b200-rental-price-august-2026-update"}
  - id: dram_contract
    layer: Memory
    name: Conventional DRAM contract price, quarter on quarter
    unit: "% q/q"
    rule: {type: level, tight_above: 10, loose_below: 0}
    fresh_days: 120
    update: "Quarterly. TrendForce publishes contract-price surveys and forecasts each quarter (trendforce.com/presscenter); use the midpoint of a forecast range and say so in `note`."
    series:
      - ["2026-03-31", 98]
      - ["2026-06-30", 60]
      - ["2026-09-30", 15.5]
    note: "Q1: 'up to 98%'. Q2: ~60% (forecast 58-63%). Q3: forecast 13-18%, midpoint shown. Still rising, but decelerating."
    sources:
      - {src: "AI Weekly, citing TrendForce (Jun 2026)", url: "https://aiweekly.co/alerts/trendforce-dram-prices-to-jump-63-again-in-q2"}
      - {src: "Hardware Busters, citing TrendForce (Jul 2026)", url: "https://hwbusters.com/news/memory-prices-keep-climbing-in-q3-but-the-surge-is-finally-cooling/"}
  - id: dc_vacancy
    layer: Data centres
    name: Vacancy, primary North American markets
    unit: "%"
    rule: {type: level, tight_below: 3, loose_above: 8}
    fresh_days: 200
    update: "Twice a year. CBRE's North America Data Center Trends (H1 in Sep, H2 in Feb/Mar) and JLL's North America Data Center Report."
    series:
      - ["2025-12-31", 1.4]
      - ["2026-06-30", 1.4]
    sources:
      - {src: "CBRE H1 2026 press release", url: "https://www.cbre.com/press-releases/north-american-data-center-demand-continues-to-outpace-supply-despite-record-construction"}
  - id: dc_vacancy_nova
    layer: Data centres
    name: Vacancy, Northern Virginia
    unit: "%"
    rule: {type: level, tight_below: 3, loose_above: 8}
    fresh_days: 200
    update: "Twice a year, from the CBRE report."
    series:
      - ["2025-06-30", 0.7]
      - ["2026-06-30", 0.2]
    sources:
      - {src: "CBRE H1 2026 press release", url: "https://www.cbre.com/press-releases/north-american-data-center-demand-continues-to-outpace-supply-despite-record-construction"}
  - id: dc_preleased
    layer: Data centres
    name: Capacity under construction already preleased
    unit: "%"
    rule: {type: level, tight_above: 75, loose_below: 50}
    fresh_days: 200
    update: "Twice a year, from the CBRE report. A falling share would be the first sign of speculative overbuild."
    series:
      - ["2025-06-30", 74.3]
      - ["2026-06-30", 80]
    note: "H1 2026 reported as 'more than 80%'."
    sources:
      - {src: "CBRE H1 2026 press release", url: "https://www.cbre.com/press-releases/north-american-data-center-demand-continues-to-outpace-supply-despite-record-construction"}
  - id: dc_pipeline_months
    layer: Data centres
    name: Supply pipeline, months of absorption
    unit: "months"
    rule: {type: level, tight_below: 24, loose_above: 36}
    fresh_days: 200
    update: "Twice a year: MW under construction divided by monthly net absorption, both from the CBRE report (H1 2026: 7,481 MW / (1,456 MW / 6))."
    series:
      - ["2026-06-30", 30.8]
    sources:
      - {src: "CBRE H1 2026 press release", url: "https://www.cbre.com/press-releases/north-american-data-center-demand-continues-to-outpace-supply-despite-record-construction"}
  - id: dc_rent_change
    layer: Data centres
    name: Asking rent change
    unit: "% (period)"
    rule: {type: level, tight_above: 5, loose_below: 0}
    fresh_days: 200
    update: "Twice a year, from CBRE (largest segment increase) or JLL (annual)."
    series:
      - ["2025-12-31", 9]
      - ["2026-06-30", 8.3]
    note: "2025: JLL, rents +9% for the year. H1 2026: CBRE, +8.3% for 3-10 MW users (largest segment rise)."
    sources:
      - {src: "w.media, citing JLL year-end 2025", url: "https://w.media/north-america-data-centers-feel-the-squeeze-as-vacancy-shrinks-to-1-percent-jll/"}
      - {src: "CBRE H1 2026 press release", url: "https://www.cbre.com/press-releases/north-american-data-center-demand-continues-to-outpace-supply-despite-record-construction"}
  - id: cowos
    layer: Packaging
    name: Advanced packaging (CoWoS) allocation
    unit: "k wafers (Broadcom, 2026)"
    rule: {type: change, tight_above: 5, loose_below: -10}
    fresh_days: 120
    update: "When analysts revise CoWoS allocations (SemiAnalysis, TrendForce, DIGITIMES). A cut caused by a slow ramp is a constraint, not weak demand; record why in `note`."
    series:
      - ["2026-06-30", 250]
      - ["2026-08-17", 215]
    note: "Cut because CoWoS-S capacity is ramping slowly; Ironwood TPU estimate cut from 3.2M to 2.7M units. Read as a supply constraint."
    override: tight
    sources:
      - {src: "DatacenterDynamics, citing SemiAnalysis", url: "https://www.datacenterdynamics.com/en/news/google-rumored-to-have-partnered-with-amd-on-tpu-v10-as-shipments-of-current-generations-revised-down-report/"}
