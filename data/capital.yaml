  - {text: "PIMCO attributes only ~13bp of a 51bp rise in the 10-year yield (Feb-May 2026) to term premium; the rest to rate expectations.", src: "PIMCO (Jun 2026)", url: "https://www.pimco.com/gbl/en/insights/ai-financing-needs-do-not-override-cyclical-drivers-of-yield"}
