facts:
  - {text: "The five hyperscalers issued $121B of US corporate bonds in 2025, against an average of $28B a year in 2020-24.", src: "Reuters via Yahoo Finance (BofA data)", url: "https://finance.yahoo.com/news/ai-hyperscalers-drive-higher-us-225314460.html"}
  - {text: "BofA expects roughly $140B a year of hyperscaler borrowing over the next three years, possibly over $300B.", src: "Reuters via Yahoo Finance", url: "https://finance.yahoo.com/news/ai-hyperscalers-drive-higher-us-225314460.html"}
  - {text: "To late May 2026, hyperscalers were ~13% of 10-year IG supply but over 30% of 30-year supply (~$32B); their 10s30s spread curves steepened while other non-financials flattened.", src: "PIMCO (Jun 2026)", url: "https://www.pimco.com/gbl/en/insights/ai-financing-needs-do-not-override-cyclical-drivers-of-yield"}
  - {text: "PIMCO attributes only ~13bp of a 51bp rise in the 10-year yield (Feb-May 2026) to term premium; the rest to rate expectations.", src: "PIMCO (Jun 2026)", url: "https://www.pimco.com/gbl/en/insights/ai-financing-needs-do-not-override-cyclical-drivers-of-yield"}
  - {text: "CoreWeave is courting life insurers for cheaper funding; its $8.5B Meta-backed loan has Blackstone Credit & Insurance as anchor lender.", src: "Forbes / Global Data Center Hub", url: "https://www.forbes.com/sites/jimosman/2026/10/14/coreweave-bonds-are-warning-of-a-bigger-problem-for-ai-stocks/"}

marker_bonds:
