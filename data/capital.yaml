  - {text: "BofA expects roughly $140B a year of hyperscaler borrowing over the next three years, possibly over $300B.", src: "Reuters via Yahoo Finance", url: "https://finance.yahoo.com/news/ai-hyperscalers-drive-higher-us-225314460.html"}
